<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Skyline Dash — Endless Runner</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="game-shell">
    <header class="hud">
      <div class="stat">
        <span class="label">Score</span>
        <strong id="scoreValue">0</strong>
      </div>
      <div class="stat">
        <span class="label">speed</span>
        <strong id="speedValue">1.0x</strong>
      </div>
      <div class="stat">
        <span class="label">Best Score</span>
        <strong id="bestValue">0</strong>
      </div>
    </header>

    <div class="stage-wrap">
      <canvas id="gameCanvas" width="840" height="380"></canvas>

      <div id="overlay" class="overlay">
        <h1 id="overlayTitle">Skyline Dash</h1>
        <p id="overlaySubtitle">Avoid the obstacles and move forward, and tap the screen to jump</p>
        <button id="actionBtn" type="button">START</button>
      </div>
    </div>

    <footer class="controls-bar">
      <span><strong>Space / ↑ / Tap:</strong>jump</span>
      <span><strong>R:</strong> Restart
       </span>
    </footer>
  </main>

  <script src="game.js" defer></script>
</body>
</html>
